name: Release

# 推送形如 vX.Y.Z，如 v0.3.0，的 tag 时自动发版：
#   凭 tag 号更新 package.json 版本并提交回 main → 装依赖并构建 → 发布 npm → 生成 GitHub Release draft。
#   人只需打一个 tag，其余自动衔接。
# 注意：npm 发布依赖 npmjs 侧开启的 Trusted Publishing
# npmjs.com → 本包 → Enable trusted publishing → 绑本仓库 GitHub Actions，
# 无需配置 NPM_TOKEN；未开启时发布步骤会失败。
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }} to npm
    runs-on: ubuntu-latest
    # id-token: write 供 Trusted Publishing 换取 npm 临时凭证，无需 NPM_TOKEN。
    # 必须放在 job 级，GitHub 才会向该 job 注入 ACTIONS_ID_TOKEN_REQUEST_*。
    permissions:
      contents: write
      id-token: write
    # fork 永不触发 tag 发布，仅作为兜底防护。
    if: startsWith(github.ref, 'refs/tags/v')
    # 绑定 GitHub Actions environment「release」，使 OIDC subject 稳定为
    # environment:release，npm 侧 Trusted Publisher 需填相同 Environment 名。
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 回写 main 需要完整历史，故拉全量。
          fetch-depth: 0
          # 默认 GITHUB_TOKEN 在分支保护下会被拒，此处显式传 token。
          token: ${{ secrets.GITHUB_TOKEN }}

      # 前置守卫：仅当该 tag 版本尚未发布到 npm 时才继续发版。
      # 补历史 tag 时对应版本早已在 npm 上，重复 publish 会报错，且版本回写会把 main 改回旧号，故已发布则跳过后续所有步骤。
      # npm view 只读 registry，无需凭证。
      - name: Skip when tag version already published
        id: published
        run: |
          set -euo pipefail
          PKG="dsh-tool-autoexpand"
          TAG="${GITHUB_REF_NAME#v}"
          if npm view "$PKG@$TAG" version >/dev/null 2>&1; then
            echo "已存在 $PKG@$TAG，跳过发布"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "未发布 $PKG@$TAG，继续"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # 版本号以源码里的 package.json 为准，正常随改动一起提交，发版前与将要打的 tag 对齐。
      # 这一步只是兜底：忘改或写错时在此对齐 tag 号，再提交回 main。
      - name: Sync version to main
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"          # 去 v 前缀得版本号，如 0.3.0
          echo "target version = $TAG"

          # 切到 main 分支再改版本，避免在 detached tag 上提交。
          git checkout main
          git config user.name  github-actions[bot]
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用临时文件改写 version 字段，保留其余内容不变。
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = process.argv[1];
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          " "$TAG"

          # 已是最新版本则无改动，跳过提交；否则提交并推回 main。
          git diff --quiet package.json || {
            git add package.json
            git commit -m "chore: release $TAG 同步 package.json 版本 [skip ci]"
            git push origin main
          }

      - name: Setup pnpm
        if: steps.published.outputs.published != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      # setup-node 的 registry-url 告知 npm 向哪个 registry 换 Trusted Publishing 临时凭证。
      # node-version 与本地 node -v 锁死同一版本。它同时满足 npm 官方 Trusted Publishing 的下限：捆绑 npm 需大于等于 11.5.1，否则 npm CLI 无法做 OIDC 自动换权，会回退用失效 token 导致 PUT 404 is not in registry。
      - name: Setup Node
        if: steps.published.outputs.published != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26.3.1
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.published.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      # 本插件暂无单测，以类型检查作为发布前的最后一道门。
      - name: Typecheck
        if: steps.published.outputs.published != 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.published.outputs.published != 'true'
        run: pnpm run build

      - name: Verify build outputs
        if: steps.published.outputs.published != 'true'
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          test -f lib/client.js
          test -f cordis.patch.yml
          echo "构建产物齐全：lib/index.js · lib/index.d.ts · lib/client.js · cordis.patch.yml"

      # Trusted Publishing：npm 凭 workflow 的 OIDC 身份直接授权，无需 NPM_TOKEN；--provenance 会在 npm 上附构建来源证明。
      - name: Publish to npm
        if: steps.published.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub Release draft
        if: steps.published.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
